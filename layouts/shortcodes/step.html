<section class="guided-step" data-step="{{ .Get "number" }}">
  <div class="guided-step-heading">
    <span class="guided-step-number" aria-hidden="true">{{ .Get "number" }}</span>
    <h2>{{ .Get "title" }}</h2>
  </div>
  <div class="guided-step-content">{{ .Inner | markdownify }}</div>
  <label class="step-complete"><input type="checkbox" data-step-complete="{{ .Get "number" }}"> <span>Marcar este paso como realizado</span></label>
</section>
