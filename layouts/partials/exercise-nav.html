{{ $exercises := where site.RegularPages "Params.exercise" "ne" nil }}
<nav aria-label="Ejercicios del taller"><ol class="exercise-nav">{{ range $exercises.ByWeight }}<li{{ if eq .RelPermalink $.RelPermalink }} class="current"{{ end }}><a href="{{ .RelPermalink }}"><span>{{ .Params.exercise }}</span><span class="exercise-nav-title">{{ .Title }}</span>{{ if eq .RelPermalink $.RelPermalink }}<small>En esta actividad</small>{{ end }}</a></li>{{ end }}</ol></nav>
