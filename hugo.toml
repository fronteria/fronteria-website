locale = "es-es"
title = "FronterIA Software"
theme = "ananke"
#theme = 'PaperMod'

[menu]
	[[menu.main]]
		name = "Inicio"
		url = "/"
		weight = 1
	[[menu.main]]
		identifier = "productos"
		name = "Productos"
		url = "/productos/"
		weight = 10
	[[menu.main]]
		identifier = "acercade"
		name = "Acerca de"
		url = "/acercade/"
		weight = 20
	[[menu.main]]
		identifier = "contacto"
		name = "Contacto"
		url = "/contacto/"
		weight = 30
	[[menu.main]]
		identifier = "recursos"
		name = "Recursos"
		url = "/recursos/"
		weight = 30

[security]
  allowContent = ['^text/markdown$', '^text/html$']

[markup.goldmark.renderer]
  unsafe = true

[params]
